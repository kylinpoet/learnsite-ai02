<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>任务提交 - 1111</title>
    <style>
        :root {
            --primary-color: #4f46e5;
            --primary-hover: #4338ca;
            --bg-color: #f3f4f6;
            --card-bg: #ffffff;
            --text-main: #1f2937;
            --text-sub: #6b7280;
            --border-color: #e5e7eb;
            --success-color: #10b981;
            --error-color: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 500px;
            background: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            overflow: hidden;
        }

        .header {
            background: var(--primary-color);
            color: white;
            padding: 20px;
            text-align: center;
        }

        .header h1 {
            font-size: 1.25rem;
            font-weight: 600;
        }

        .header p {
            font-size: 0.875rem;
            opacity: 0.9;
            margin-top: 5px;
        }

        .form-content {
            padding: 24px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 0.875rem;
            font-weight: 500;
            color: var(--text-main);
            margin-bottom: 8px;
        }

        .form-group input, 
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 0.95rem;
            transition: border-color 0.2s, box-shadow 0.2s;
            outline: none;
        }

        .form-group input:focus, 
        .form-group textarea:focus,
        .form-group select:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
        }

        .form-group textarea {
            resize: vertical;
            min-height: 100px;
        }

        .btn-submit {
            width: 100%;
            padding: 12px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .btn-submit:hover {
            background-color: var(--primary-hover);
        }

        .btn-submit:disabled {
            background-color: var(--text-sub);
            cursor: not-allowed;
        }

        .feedback-area {
            margin-top: 20px;
            padding: 12px;
            border-radius: 6px;
            font-size: 0.875rem;
            display: none;
        }

        .feedback-success {
            background-color: #ecfdf5;
            color: #065f46;
            border: 1px solid #a7f3d0;
        }

        .feedback-error {
            background-color: #fef2f2;
            color: #991b1b;
            border: 1px solid #fecaca;
        }

        .loading-spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 1s ease-in-out infinite;
            margin-right: 8px;
            vertical-align: middle;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .info-text {
            font-size: 0.75rem;
            color: var(--text-sub);
            margin-top: 4px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>任务提交：1111</h1>
        <p>请填写下方表单并提交数据</p>
    </div>

    <div class="form-content">
        <form id="submissionForm">
            <!-- 任务ID隐藏字段，用于数据关联 -->
            <input type="hidden" name="taskId" value="900012">
            <input type="hidden" name="token" value="77a6de7a98396a82e6cf727db050c295b984">

            <div class="form-group">
                <label for="studentName">姓名 <span style="color:red">*</span></label>
                <input type="text" id="studentName" name="studentName" placeholder="请输入您的姓名" required>
            </div>

            <div class="form-group">
                <label for="studentId">学号 <span style="color:red">*</span></label>
                <input type="text" id="studentId" name="studentId" placeholder="请输入您的学号" required>
            </div>

            <div class="form-group">
                <label for="dataContent">任务内容/数据 <span style="color:red">*</span></label>
                <textarea id="dataContent" name="dataContent" placeholder="请输入任务“1111”的相关数据或内容..." required></textarea>
                <div class="info-text">请确保内容真实有效。</div>
            </div>

            <div class="form-group">
                <label for="remarks">备注 (选填)</label>
                <input type="text" id="remarks" name="remarks" placeholder="其他需要说明的信息">
            </div>

            <button type="submit" class="btn-submit" id="submitBtn">提交数据</button>
        </form>

        <div id="feedback" class="feedback-area"></div>
    </div>
</div>

<script>
    document.getElementById('submissionForm').addEventListener('submit', function(e) {
        e.preventDefault();
        
        const submitBtn = document.getElementById('submitBtn');
        const feedback = document.getElementById('feedback');
        const form = e.target;
        
        // 禁用按钮，防止重复提交
        submitBtn.disabled = true;
        submitBtn.innerHTML = '<span class="loading-spinner"></span>提交中...';
        feedback.style.display = 'none';

        // 收集表单数据
        const formData = new FormData(form);
        const data = {};
        formData.forEach((value, key) => {
            data[key] = value;
        });

        // 添加时间戳
        data['submitTime'] = new Date().toISOString();

        const apiUrl = 'http://localhost:5173/api/v1/tasks/900012/data-submit/77a6de7a98396a82e6cf727db050c295b984';

        fetch(apiUrl, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify(data)
        })
        .then(response => {
            if (response.ok) {
                return response.json();
            } else {
                throw new Error('服务器响应错误: ' + response.status);
            }
        })
        .then(result => {
            // 成功处理
            feedback.className = 'feedback-area feedback-success';
            feedback.innerHTML = '<strong>提交成功！</strong><br>数据已上传，您可以关闭此页面。';
            feedback.style.display = 'block';
            form.reset();
        })
        .catch(error => {
            // 错误处理
            console.error('Error:', error);
            feedback.className = 'feedback-area feedback-error';
            feedback.innerHTML = '<strong>提交失败</strong><br>请检查网络连接或稍后重试。<br>错误信息: ' + error.message;
            feedback.style.display = 'block';
        })
        .finally(() => {
            // 恢复按钮状态
            submitBtn.disabled = false;
            submitBtn.textContent = '提交数据';
        });
    });
</script>

</body>
</html>
