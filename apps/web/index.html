<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>OW³教学评AI平台</title>
    <script>
      // 首屏防闪：在样式与脚本加载前先定下配色（与 stores/app.ts 的 storageKey 保持一致）
      (function () {
        try {
          var mode = localStorage.getItem('learnsite-scheme') || 'light';
          var dark = mode === 'dark'
            || (mode === 'auto' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.dataset.scheme = dark ? 'dark' : 'light';
        } catch (error) {
          document.documentElement.dataset.scheme = 'light';
        }
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
